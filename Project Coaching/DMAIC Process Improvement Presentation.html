<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMAIC Process Improvement Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBFCFE; --ink:#14213D; --muted:#5A6580; --line:#D9DEE8; --soft:#EEF2F9; --shell:#E3E8F1;
  --d:#2F6FDE; --m:#0E8F9C; --a:#E8A800; --i:#7A3FD1; --c:#2E8B57; --bad:#C2362B;
  --on-a:#14213D;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16203A; --ink:#EEF2FA; --muted:#9FAAC4; --line:#2E3B5E; --soft:#1F2B4B; --shell:#0D1427;
    --d:#6C9BFF; --m:#3CC4D1; --a:#F2BE2E; --i:#B08AF2; --c:#58C58B; --bad:#FF7C70;
  }
}
:root[data-theme="dark"]{
  --paper:#16203A; --ink:#EEF2FA; --muted:#9FAAC4; --line:#2E3B5E; --soft:#1F2B4B; --shell:#0D1427;
  --d:#6C9BFF; --m:#3CC4D1; --a:#F2BE2E; --i:#B08AF2; --c:#58C58B; --bad:#FF7C70;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--shell);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
#stage{width:1280px;height:720px;flex:none;position:relative;background:var(--paper);overflow:hidden;transform-origin:center center;box-shadow:0 2px 24px rgba(0,0,0,.12)}
.rail{position:absolute;left:0;top:0;bottom:0;width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--soft);border-right:1px solid var(--line)}
.rail span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--head);color:var(--muted);border:2px solid var(--line);background:var(--paper)}
.rail span.on{color:#fff;border-color:transparent;transform:scale(1.15)}
.rail span.on[data-p="a"]{color:var(--on-a)}
.rail span.done{border-color:currentColor}
.rail .bar{width:2px;height:10px;background:var(--line)}
.slide{position:absolute;left:72px;right:0;top:0;bottom:0;padding:48px 64px 52px 64px;display:none;flex-direction:column}
.slide.show{display:flex}
.sec{font:600 16px var(--body);color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.sec i{width:28px;height:4px;border-radius:2px;background:var(--pc,var(--ink));display:inline-block}
h1,h2{font-family:var(--head);margin:0;letter-spacing:-.015em;line-height:1.08}
h2{font-size:42px;font-weight:700;margin-bottom:26px;max-width:960px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;font-size:23px;line-height:1.38}
p{margin:0}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
li{padding-left:22px;position:relative}
li::before{content:"";position:absolute;left:0;top:.6em;width:9px;height:9px;border-radius:2px;background:var(--pc,var(--ink))}
.cols{display:grid;gap:22px;grid-template-columns:repeat(var(--n,3),1fr);flex:1;min-height:0}
.col{border-top:4px solid var(--pc,var(--ink));padding-top:12px}
.col h3{font:700 24px var(--head);margin:0 0 10px}
.col ul{font-size:21px}
.quote{font:600 28px/1.3 var(--head);border-left:6px solid var(--pc,var(--ink));padding:4px 0 4px 22px;max-width:1000px}
table{border-collapse:collapse;width:100%;font-size:20px}
th{text-align:left;font:700 18px var(--head);color:var(--muted);border-bottom:2px solid var(--ink);padding:8px 12px}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
td.y{color:var(--c);font-weight:700}td.n{color:var(--bad);font-weight:700}
tr.sel td{background:color-mix(in srgb,var(--c) 14%,transparent)}
.flow{display:flex;align-items:stretch;gap:0}
.flow .st{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;font:600 19px/1.2 var(--head);display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative}
.flow .st small{font:400 16px var(--body);color:var(--muted)}
.flow .ar{width:30px;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
.flow .st.bad{border-color:var(--bad)}
.flow.big .st{padding:18px 10px;font-size:22px}
.stats{display:flex;gap:22px}
.stat{flex:1;border-radius:12px;padding:18px 20px;background:var(--soft);border-bottom:6px solid var(--pc,var(--ink))}
.stat b{display:block;font:800 56px/1 var(--head);margin-bottom:6px}
.stat span{font-size:20px;color:var(--muted)}
.stat.good{border-bottom-color:var(--c)} .stat.good b{color:var(--c)}
.stat.bad{border-bottom-color:var(--bad)} .stat.bad b{color:var(--bad)}
.check{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:22px}
.check div{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.check div::before{content:"✓";display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pc);color:#fff;font:700 17px var(--body);flex:none}
.p-a .check div::before{color:var(--on-a)}
.note-box{background:var(--soft);border-radius:10px;padding:14px 18px;font-size:21px}
.ph{background:color-mix(in srgb,var(--a) 28%,transparent);border-radius:4px;padding:0 4px}
.chart{width:100%;height:100%}
.chart text{fill:var(--muted);font:600 15px var(--body)}
.chart .v{fill:var(--ink);font:700 16px var(--head)}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;flex:1;min-height:0;align-items:center}
.cover{justify-content:center}
.cover h1{font-size:68px;font-weight:800;max-width:900px;margin-bottom:18px}
.cover .sub{font-size:28px;color:var(--muted);margin-bottom:34px}
.cover .meta{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;font-size:22px}
.cover .meta b{color:var(--muted);font-weight:600}
.phases{display:flex;gap:6px;margin-top:40px}
.phases i{height:10px;flex:1;border-radius:5px}
.p-d{--pc:var(--d)}.p-m{--pc:var(--m)}.p-a{--pc:var(--a)}.p-i{--pc:var(--i)}.p-c{--pc:var(--c)}
.bigmsg{font:700 40px/1.25 var(--head);max-width:900px}
/* controls */
#ui{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
#ui button{font:600 15px var(--body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
#ui button:hover{background:var(--line)}
#ui button:focus-visible,#wrap:focus-visible{outline:3px solid var(--d);outline-offset:2px}
#ui .sp{flex:1}
#prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
#prog i{display:block;height:100%;width:0;background:var(--ink)}
#notes{flex:none;display:none;max-height:28vh;overflow:auto;padding:12px 18px;background:var(--paper);border-top:1px solid var(--line);font-size:17px;line-height:1.45;color:var(--ink)}
#notes.on{display:block}
#notes b{color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.slide.show{animation:in .18s ease-out}@keyframes in{from{opacity:.0}to{opacity:1}}}
@media print{
  body{overflow:visible;height:auto;background:#fff}#ui,#notes,.rail{display:none!important}
  #wrap{display:block;padding:0}#stage{transform:none!important;box-shadow:none;height:auto;width:1280px;overflow:visible}
  .slide{display:flex!important;position:relative;left:0;height:720px;page-break-after:always}
}
</style>
</head>
<body>
<div id="wrap" tabindex="0" aria-label="Slides. Use arrow keys to navigate."><div id="stage">
  <div class="rail" id="rail" aria-hidden="true"></div>
</div></div>
<div id="notes" aria-live="polite"></div>
<div id="ui">
  <button id="prev" aria-label="Previous slide">Previous</button>
  <button id="next" aria-label="Next slide">Next</button>
  <span id="count">1 / 30</span>
  <div id="prog"><i></i></div>
  <button id="nbtn" aria-pressed="false">Speaker notes (N)</button>
  <button id="fs">Full screen (F)</button>
</div>

<script>
/* ---------- helpers ---------- */
const ph = s => s.replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>');
const ul = a => '<ul>'+a.map(x=>'<li>'+ph(x)+'</li>').join('')+'</ul>';
const B = {
  p:  b => '<p>'+ph(b.x)+'</p>',
  quote: b => '<div class="quote">'+ph(b.x)+'</div>',
  big: b => '<div class="bigmsg">'+ph(b.x)+'</div>',
  note: b => '<div class="note-box">'+ph(b.x)+'</div>',
  list: b => ul(b.items),
  cols: b => '<div class="cols" style="--n:'+b.cols.length+'">'+b.cols.map(c=>'<div class="col"><h3>'+ph(c.h)+'</h3>'+ul(c.items)+'</div>').join('')+'</div>',
  table: b => '<table><thead><tr>'+b.head.map(h=>'<th>'+ph(h)+'</th>').join('')+'</tr></thead><tbody>'+
     b.rows.map(r=>'<tr'+(r.sel?' class="sel"':'')+'>'+(r.c||r).map(c=>{
        let k=''; if(c==='✓')k=' class="y"'; if(c==='✗')k=' class="n"'; return '<td'+k+'>'+ph(c)+'</td>';}).join('')+'</tr>').join('')+'</tbody></table>',
  flow: b => '<div class="flow'+(b.big?' big':'')+'">'+b.items.map((s,i)=>{
      const t=Array.isArray(s)?s:[s]; const bad=t[2]==='bad';
      return (i?'<div class="ar">›</div>':'')+'<div class="st'+(bad?' bad':'')+'">'+ph(t[0])+(t[1]?'<small>'+ph(t[1])+'</small>':'')+'</div>';}).join('')+'</div>',
  stats: b => '<div class="stats">'+b.items.map(s=>'<div class="stat '+(s.k||'')+'"><b>'+ph(s.n)+'</b><span>'+ph(s.l)+'</span></div>').join('')+'</div>',
  check: b => '<div class="check">'+b.items.map(x=>'<div>'+ph(x)+'</div>').join('')+'</div>',
  bars: b => {
    const W=640,H=340,L=46,Bt=40,T=20,max=12,bw=58,gap=(W-L-10-bw*b.v.length)/(b.v.length-1);
    const y=v=>H-Bt-(v/max)*(H-Bt-T);
    let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Average lead time by month against target">';
    [0,5,10].forEach(t=>{s+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y(t)+5)+'" text-anchor="end">'+t+'</text>';});
    b.v.forEach((v,i)=>{const x=L+10+i*(bw+gap);
      s+='<rect x="'+x+'" y="'+y(v)+'" width="'+bw+'" height="'+(H-Bt-y(v))+'" rx="4" fill="var(--m)"/><text class="v" x="'+(x+bw/2)+'" y="'+(y(v)-7)+'" text-anchor="middle">'+v+'</text><text x="'+(x+bw/2)+'" y="'+(H-16)+'" text-anchor="middle">'+b.l[i]+'</text>';});
    s+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y(5)+'" y2="'+y(5)+'" stroke="var(--c)" stroke-width="3" stroke-dasharray="8 6"/><text x="'+(W-8)+'" y="'+(y(5)-8)+'" text-anchor="end" style="fill:var(--c)">Target 5 days</text>';
    return s+'</svg>';
  },
  pareto: b => {
    const W=640,H=340,L=46,R=46,Bt=56,T=20,n=b.v.length,bw=84,gap=(W-L-R-bw*n)/(n+1);
    const y=v=>H-Bt-(v/100)*(H-Bt-T);
    let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pareto chart of delay causes">';
    [0,25,50,75,100].forEach(t=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y(t)+5)+'" text-anchor="end">'+t+'%</text>';});
    let cum=0,pts=[];
    b.v.forEach((v,i)=>{const x=L+gap+i*(bw+gap);cum+=v;
      s+='<rect x="'+x+'" y="'+y(v)+'" width="'+bw+'" height="'+(H-Bt-y(v))+'" rx="4" fill="'+(i<2?'var(--a)':'var(--line)')+'"/><text class="v" x="'+(x+bw/2)+'" y="'+(y(v)-7)+'" text-anchor="middle">'+v+'%</text>';
      b.l[i].split('|').forEach((ln,k)=>{s+='<text x="'+(x+bw/2)+'" y="'+(H-34+k*17)+'" text-anchor="middle">'+ln+'</text>';});
      pts.push([x+bw/2,y(cum)]);});
    s+='<polyline fill="none" stroke="var(--ink)" stroke-width="3" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
    pts.forEach(p=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--ink)"/>';});
    return s+'</svg>';
  },
  split: b => '<div class="split"><div style="display:flex;flex-direction:column;gap:16px">'+b.left.map(render).join('')+'</div><div>'+b.right.map(render).join('')+'</div></div>'
};
const render = b => B[b.t](b);

/* ---------- content ---------- */
const S1='1 Situation', S2='2 Goal', S3='3 Action: DMAIC', S4='4 Result', S5='5 Lessons learned';
const slides = [
{cover:1,notes:"Good morning. Today I would like to present my improvement project. I will explain the current situation, the problem I identified, the analysis I performed, the improvements implemented, and the results achieved. I will also share the lessons learned from the project."},

{sec:S1,title:"Organisation and department background",blocks:[
 {t:'cols',cols:[
  {h:'Organisation',items:['[Company background]','[Business area]','[Main products / services]']},
  {h:'Department',items:['[Department structure]','[Main responsibilities]','[Key stakeholders]']},
  {h:'Process',items:['[Process being improved]','[Who is involved]','[Output of the process]']}]},
 {t:'note',x:'Add a simple organisation or process diagram here.'}],
 notes:"First, some background about the organisation and the department. The department is responsible for [process/function]. The process involves several stakeholders, including [A], [B] and [C]. The output of this process is [output]. During the initial observation, I noticed several issues affecting process performance."},

{sec:S1,title:"Current process (AS-IS)",blocks:[
 {t:'flow',items:['Request received','Data entry','Verification','Approval','Processing','Final output']},
 {t:'table',head:['Step','Owner','Lead time','Problem'],rows:[
  ['Request','User','1 day','Incomplete information'],['Data entry','Staff','2 days','Manual entry'],
  ['Verification','Team A','1 day','Rework'],['Approval','Manager','2 days','Waiting'],['Processing','Team B','1 day','Queue']]}],
 notes:"This is the current process. I mapped it from beginning to end to understand where time and defects were occurring. Some steps were value-added, while other time was caused by waiting, rework and manual activities. (Table values are examples; replace with your own.)"},

{sec:S1,title:"Problem statement",blocks:[
 {t:'quote',x:'From [Jan to Jun 2026] the process averaged [10] working days against an expected [5]. [18%] of cases needed rework, mainly from incomplete or incorrect information.'},
 {t:'cols',cols:[
  {h:'Problem',items:['Lead time too long','High rework','Manual activities','Waiting between departments']},
  {h:'Business impact',items:['Customer delay','Higher operating effort','Employee frustration','Additional cost']}]}],
 notes:"The main problem was not simply that the process was slow. Based on the data, the average lead time was 10 working days, while the expected lead time was 5. Around 18 percent of cases required rework. This created delays for customers and additional workload for employees."},

{sec:S1,title:"Why this project is needed",blocks:[
 {t:'cols',cols:[
  {h:'Customer',items:['Longer waiting time','Poor experience']},
  {h:'Business',items:['Higher processing cost','Lower productivity']},
  {h:'Employee',items:['More manual work','More follow-up']},
  {h:'Quality',items:['More errors','More rework']}]}],
 notes:"This project mattered because the problem affected several areas at once. Customers waited longer. The business needed extra resources for rework. Employees spent time correcting problems instead of processing new cases."},

{sec:S2,title:"Goal statement",blocks:[
 {t:'quote',x:'Reduce average lead time from [10] to [5] working days by [Dec 2026], and cut the rework rate from [18%] to below [5%].'},
 {t:'stats',items:[{n:'[10] → [5]',l:'Lead time (working days)',k:'good'},{n:'[18%] → <[5%]',l:'Rework rate',k:'good'},{n:'[Jun → Dec 2026]',l:'Timeline'}]}],
 notes:"My goal was to reduce the average lead time from 10 working days to 5, and at the same time reduce the rework rate from 18 percent to below 5 percent. The target completion date was December 2026."},

{sec:S2,title:"Project scope",blocks:[
 {t:'cols',cols:[
  {h:'In scope',items:['[Process A]','[Department A]','[Department B]','Activities from request to completion']},
  {h:'Out of scope',items:['Other departments','Customer onboarding','Legacy processes outside this workflow']}]}],
 notes:"To avoid making the project too broad, I defined the scope at the beginning. The project covers the process from [starting point] to [end point]. Other processes, such as [example], were excluded because they were outside the main problem area."},

{sec:S3,title:"DMAIC project approach",ph:'all',blocks:[
 {t:'flow',big:1,items:['Define','Measure','Analyze','Improve','Control']},
 {t:'cols',cols:[
  {h:'Define',items:['Problem and scope']},{h:'Measure',items:['Baseline data']},{h:'Analyze',items:['Root causes']},{h:'Improve',items:['Solutions']},{h:'Control',items:['Sustain results']}]}],
 notes:"I used DMAIC to structure the project. First I defined the problem and scope. Then I measured current performance. I analysed the data to find root causes, selected and implemented improvements, and finally set up controls to sustain the results."},

{sec:'Define',ph:'d',title:"Define tollgate review",blocks:[
 {t:'check',items:['Problem defined','Business case','Goal defined','Scope defined','Sponsor approval']},
 {t:'note',x:'Sponsor feedback: [insert actual sponsor feedback]'}],
 notes:"At the Define tollgate I reviewed the project with the sponsor. We confirmed the problem was clearly defined, the goal measurable and the scope realistic. The sponsor also gave feedback on [specific feedback]."},

{sec:'Measure',ph:'m',title:"Measurement plan",blocks:[
 {t:'cols',cols:[
  {h:'What I measured',items:['Lead time','Defect rate','Rework rate','Number of cases','Waiting time','Processing time']},
  {h:'Data source',items:['[System / database]','[Excel]','[Manual records]','[Customer records]']},
  {h:'Measurement period',items:['[Jan – Jun 2026]']}]}],
 notes:"In the Measure phase I first identified what data was required, focusing on measurements directly related to the problem statement. I collected data from [system/database/Excel] covering [date] to [date]."},

{sec:'Measure',ph:'m',title:"Baseline performance",blocks:[
 {t:'split',left:[{t:'bars',v:[9.8,10.2,10.5,9.7,10.1,10.4],l:['Jan','Feb','Mar','Apr','May','Jun']}],
  right:[{t:'p',x:'Average lead time by month (working days). Example data: replace with yours.'},{t:'stats',items:[{n:'[10] days',l:'Lead time, target [5]',k:'bad'}]},{t:'stats',items:[{n:'[18%]',l:'Rework rate, target <[5%]',k:'bad'}]},{t:'p',x:'Consistent every month, so the problem is real.'}]}],
 notes:"Here is the baseline. I did not only show averages: the monthly trend shows the problem is real and consistent, not a one-off."},

{sec:'Measure',ph:'m',title:"Measure tollgate",blocks:[
 {t:'check',items:['Data collection completed','Measurement definition confirmed','Baseline established','Data quality checked','Sponsor review completed']}],
 notes:"At the Measure tollgate I reviewed the baseline with the sponsor. We confirmed the data represented actual process performance and agreed the baseline could be used for further analysis."},

{sec:'Analyze',ph:'a',title:"Root cause analysis (fishbone)",blocks:[
 {t:'p',x:'Problem: long lead time'},
 {t:'cols',cols:[
  {h:'People',items:['Different working methods']},{h:'Process',items:['Too many approval steps']},{h:'System',items:['Manual data entry']},
  {h:'Information',items:['Incomplete request']},{h:'Management',items:['Waiting for approval']},{h:'Environment',items:['[Add cause]']}]},
 {t:'note',x:'Tip: replace this grid with your drawn fishbone diagram.'}],
 notes:"I brainstormed possible causes across people, process, system, information, management and environment, using a fishbone diagram."},

{sec:'Analyze',ph:'a',title:"Data analysis: where do delays come from?",blocks:[
 {t:'split',left:[{t:'pareto',v:[40,30,20,10],l:['Approval|waiting','Incomplete|information','Manual|processing','Other']}],
  right:[{t:'p',x:'Analysis of [500] cases (example figures).'},{t:'list',items:['Approval waiting: 40%','Incomplete information: 30%','Manual processing: 20%','Other: 10%']},{t:'note',x:'The top two causes are about 70% of delays, so the improvement focuses there.'}]}],
 notes:"I did not want to select solutions based on assumptions, so I analysed actual process data. Approval waiting was the biggest contributor, followed by incomplete information. Together they represent about 70 percent of observed delays, so I focused the improvement effort on them."},

{sec:'Analyze',ph:'a',title:"Root cause confirmation",blocks:[
 {t:'table',head:['Potential cause','Data evidence','Result'],rows:[
  ['Staff workload','Low correlation','✗'],['System performance','No significant impact','✗'],['Incomplete information','Strong correlation','✓'],['Approval waiting','Strong correlation','✓']]}],
 notes:"I separated assumptions from validated causes. Some causes looked important at first, but the data did not support them. The analysis confirmed the main root causes were incomplete information and approval waiting time."},

{sec:'Analyze',ph:'a',title:"Analyze tollgate",blocks:[
 {t:'check',items:['Root causes identified','Root causes validated','Data analysis completed','Improvement opportunities identified','Sponsor agreement']},
 {t:'note',x:'Sponsor decision: proceed with improvement focused on [Root cause 1] and [Root cause 2].'}],
 notes:"At the Analyze tollgate the sponsor agreed to proceed with improvement focused on the two validated root causes."},

{sec:'Improve',ph:'i',title:"Improvement options and decision logic",blocks:[
 {t:'table',head:['Solution','Impact','Cost','Difficulty','Selected'],rows:[
  {c:['Additional staff','High','High','Medium','✗']},{c:['Automation','High','Medium','Medium','✓'],sel:1},{c:['New approval workflow','High','Low','Low','✓'],sel:1},{c:['Training only','Medium','Low','Low','✗']}]},
 {t:'note',x:'State your selection criteria here: [impact on validated root causes, cost, effort, sustainability].'}],

/* ---------- build ---------- */
const stage=document.getElementById('stage'), rail=document.getElementById('rail');
const PH=[['d','D'],['m','M'],['a','A'],['i','I'],['c','C']];
rail.innerHTML=PH.map((p,i)=>(i?'<div class="bar"></div>':'')+'<span data-p="'+p[0]+'">'+p[1]+'</span>').join('');
const chips=[...rail.querySelectorAll('span')];
slides.forEach((s,n)=>{
  const el=document.createElement('section'); el.className='slide'+(s.ph&&s.ph!=='all'?' p-'+s.ph:'')+(s.cover||s.closing?' cover':''); el.setAttribute('aria-label','Slide '+(n+1));
  if(s.cover){
    el.innerHTML='<h1>[Project name]: process improvement project</h1><div class="sub">DMAIC improvement project</div>'+
     '<div class="meta"><b>Name</b><span class="ph">[Your name]</span><b>Department</b><span class="ph">[Department]</span><b>Project sponsor</b><span class="ph">[Name]</span><b>Master Black Belt / assessor</b><span class="ph">[Name]</span><b>Date</b><span class="ph">[Date]</span></div>'+
     '<div class="phases"><i style="background:var(--d)"></i><i style="background:var(--m)"></i><i style="background:var(--a)"></i><i style="background:var(--i)"></i><i style="background:var(--c)"></i></div>';
  } else {
    el.innerHTML='<div class="sec"><i></i>'+s.sec+'</div><h2>'+s.title+'</h2><div class="body">'+s.blocks.map(render).join('')+'</div>';
  }
  stage.appendChild(el);
});
const els=[...stage.querySelectorAll('.slide')];
const notes=document.getElementById('notes'), count=document.getElementById('count'), prog=document.querySelector('#prog i');
let cur=0;
function go(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  els.forEach((e,i)=>e.classList.toggle('show',i===cur));
  const s=slides[cur]; const idx=PH.findIndex(p=>p[0]===s.ph);
  const doneUpTo = s.ph==='all' ? -1 : (idx>=0 ? idx : (['Summary','Close'].includes(s.sec)||s.sec===S4||s.sec===S5 ? 5 : -1));
  chips.forEach((c,i)=>{c.className=''; if(idx===i||s.ph==='all')c.classList.add('on'); else if(i<doneUpTo)c.classList.add('done');
    c.style.background=(idx===i||s.ph==='all')?'var(--'+c.dataset.p+')':''; c.style.color=(i<doneUpTo&&idx!==i)?'var(--'+c.dataset.p+')':'';});
  notes.innerHTML='<b>Speaker notes:</b> '+ph(s.notes||'');
  count.textContent=(cur+1)+' / '+slides.length; prog.style.width=((cur+1)/slides.length*100)+'%';
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
}
function fit(){
  const w=document.getElementById('wrap'); const nb=notes.classList.contains('on');
  const sc=Math.min((w.clientWidth-16)/1280,(w.clientHeight-16)/720);
  stage.style.transform='scale('+Math.max(sc,.2)+')';
  stage.style.margin=(-(720*(1-sc))/2)+'px '+(-(1280*(1-sc))/2)+'px';
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
const nbtn=document.getElementById('nbtn');
function toggleNotes(){notes.classList.toggle('on');nbtn.setAttribute('aria-pressed',notes.classList.contains('on'));fit();}
nbtn.onclick=toggleNotes;
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}}
document.getElementById('fs').onclick=fs;
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
  else if(e.key==='n'||e.key==='N')toggleNotes(); else if(e.key==='f'||e.key==='F')fs();
});
let tx=null;
document.getElementById('wrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('wrap').addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null;});
window.addEventListener('resize',fit);
fit();
const h=parseInt(location.hash.slice(1));go(isNaN(h)?0:h-1);
</script>
